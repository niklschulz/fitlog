<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fitlog</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">

<!-- iOS Home-Screen-Standalone-Modus -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fitlog">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="css/styles.css">

<!-- Tailwind: einmalig vorkompiliertes CSS (`npm run build:css`, s. ADR 0030), nach styles.css
     eingebunden wie früher die Play-CDN-Styles. Nach Änderungen an Klassen neu bauen. -->
<link rel="stylesheet" href="css/tailwind.css">

<!-- Dexie lokal ausgeliefert (js/vendor/, s. ADR 0031) - kein Drittserver beim Start. -->
<script src="js/vendor/dexie.min.js"></script>
</head>
<body class="bg-base text-ink font-sans">
  <div id="app" class="min-h-screen flex flex-col">
    <main id="view-container" class="flex-1 overflow-y-auto px-4 pb-[calc(88px+env(safe-area-inset-bottom))] safe-top"></main>

    <div class="nav-scrim" aria-hidden="true"></div>

    <nav id="bottom-nav" class="z-20 fixed left-4 right-4 bottom-[calc(8px+env(safe-area-inset-bottom))] rounded-full flex px-1.5 py-1.5 gap-1">
      <div id="nav-indicator" aria-hidden="true"></div>
      <button data-view="workout" class="nav-btn active tap-feedback flex-1 flex flex-col items-center justify-center gap-0.5 py-2 rounded-full text-muted min-h-[44px]">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-[26px] h-[26px]">
          <rect x="2.5" y="7" width="4" height="10" rx="2" />
          <rect x="17.5" y="7" width="4" height="10" rx="2" />
          <path d="M1 10.5v3M23 10.5v3M6.5 12h11" />
        </svg>
        <span class="text-label">Workout</span>
      </button>
      <button data-view="statistics" class="nav-btn tap-feedback flex-1 flex flex-col items-center justify-center gap-0.5 py-2 rounded-full text-muted min-h-[44px]">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-[26px] h-[26px]">
          <path d="M4 3v12a2 2 0 0 0 2 2h13" />
          <path d="M6.5 14l3-3 2 2 5.5-6" />
        </svg>
        <span class="text-label">Statistik</span>
      </button>
      <button data-view="profile" class="nav-btn tap-feedback flex-1 flex flex-col items-center justify-center gap-0.5 py-2 rounded-full text-muted min-h-[44px]">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-[26px] h-[26px]">
          <circle cx="12" cy="8.5" r="3.5" />
          <path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6" />
        </svg>
        <span class="text-label">Profil</span>
      </button>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
