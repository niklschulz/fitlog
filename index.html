<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fitlog</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">

<!-- iOS Home-Screen-Standalone-Modus -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fitlog">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="css/styles.css">

<!-- Tailwind Play CDN: bewusst kein Build-Schritt (s. ADR 0002).
     Erstinstallation braucht Internet, danach cacht der Service Worker das Skript. -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Design-Tokens: zentrale Quelle, s. docs/design-system.md.
  // Kein tailwind.config.js als Datei, da bewusst kein Build-Schritt (ADR 0002) -
  // dieses inline-Objekt ist hier der äquivalente, einzige Ort für alle Tokens.
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          base: '#121212',
          surface: '#1E1E1E',
          raised: '#2A2A2A',
          accent: '#A3E635',
          ink: '#F5F5F5',
          muted: '#9B9BA1',
        },
        borderRadius: {
          card: '18px',
          btn: '13px',
          sheet: '26px',
          badge: '11px',
        },
        fontFamily: {
          sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', 'system-ui', 'sans-serif'],
        },
        fontSize: {
          kpi: ['34px', { lineHeight: '1.1', fontWeight: '700' }],
          'screen-title': ['21px', { lineHeight: '1.2', fontWeight: '700' }],
          'card-title': ['16px', { lineHeight: '1.3', fontWeight: '600' }],
          body: ['14px', { lineHeight: '1.45', fontWeight: '400' }],
          label: ['11.5px', { lineHeight: '1.2', fontWeight: '600', letterSpacing: '0.6px' }],
        },
      },
    },
  };
</script>

<script src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
</head>
<body class="bg-base text-ink font-sans">
  <div id="app" class="min-h-screen flex flex-col">
    <main id="view-container" class="flex-1 overflow-y-auto px-4 pb-[calc(88px+env(safe-area-inset-bottom))] safe-top"></main>

    <div class="nav-scrim" aria-hidden="true"></div>

    <nav id="bottom-nav" class="z-20 fixed left-4 right-4 bottom-[calc(8px+env(safe-area-inset-bottom))] rounded-full flex px-1.5 py-1.5 gap-1">
      <button data-view="workout" class="nav-btn active tap-feedback flex-1 flex flex-col items-center justify-center gap-0.5 py-2 rounded-full text-muted min-h-[44px]">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-[22px] h-[22px]">
          <path d="M6.5 9v6M4 10.5v3M17.5 9v6M20 10.5v3M8.5 12h7" />
        </svg>
        <span class="text-label">Workout</span>
      </button>
      <button data-view="exercises" class="nav-btn tap-feedback flex-1 flex flex-col items-center justify-center gap-0.5 py-2 rounded-full text-muted min-h-[44px]">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-[22px] h-[22px]">
          <path d="M9 6h10M9 12h10M9 18h10M4.5 6l.75.75L6.5 5.5M4.5 12l.75.75L6.5 10.5M4.5 18l.75.75L6.5 16.5" />
        </svg>
        <span class="text-label">Übungen</span>
      </button>
      <button data-view="routines" class="nav-btn tap-feedback flex-1 flex flex-col items-center justify-center gap-0.5 py-2 rounded-full text-muted min-h-[44px]">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-[22px] h-[22px]">
          <rect x="4" y="5.5" width="16" height="15" rx="3" />
          <path d="M8 3.5v4M16 3.5v4M4 10.5h16" />
        </svg>
        <span class="text-label">Routinen</span>
      </button>
      <button data-view="profile" class="nav-btn tap-feedback flex-1 flex flex-col items-center justify-center gap-0.5 py-2 rounded-full text-muted min-h-[44px]">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-[22px] h-[22px]">
          <circle cx="12" cy="8.5" r="3.5" />
          <path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6" />
        </svg>
        <span class="text-label">Profil</span>
      </button>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
